name: Build Desktop App
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-macos-x64:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'
      - name: Install Electron dependencies
        run: npm install
      - name: Build frontend
        run: |
          cd web
          pnpm install --no-frozen-lockfile
          pnpm build
      - name: Free disk space
        run: |
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes || true
          df -h
      - name: Build macOS DMG (x64)
        run: |
          for i in 1 2 3; do
            echo "Build attempt $i..."
            npx electron-builder --mac --arch x64 && break
            echo "Attempt $i failed, waiting 15s before retry..."
            sleep 15
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
      - name: List release files
        run: find release -name "*.dmg" 2>/dev/null || echo "No dmg found"
      - name: Upload macOS DMG (x64)
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-x64
          path: release/**/*.dmg
          if-no-files-found: error
      - name: Upload macOS DMG (x64) to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/**/*.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'
      - name: Install Electron dependencies
        run: npm install
      - name: Build frontend
        run: |
          cd web
          pnpm install --no-frozen-lockfile
          pnpm build
      - name: Free disk space
        run: |
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes || true
          df -h
      - name: Build macOS DMG (arm64)
        run: |
          for i in 1 2 3; do
            echo "Build attempt $i..."
            npx electron-builder --mac --arch arm64 && break
            echo "Attempt $i failed, waiting 15s before retry..."
            sleep 15
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
      - name: List release files
        run: find release -name "*.dmg" 2>/dev/null || echo "No dmg found"
      - name: Upload macOS DMG (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-arm64
          path: release/**/*.dmg
          if-no-files-found: error
      - name: Upload macOS DMG (arm64) to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/**/*.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'
      - name: Install Electron dependencies
        run: npm install
      - name: Build frontend
        run: |
          cd web
          pnpm install --no-frozen-lockfile
          pnpm build
      - name: Build Windows installer
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
          if-no-files-found: error
      - name: Upload Windows EXE to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

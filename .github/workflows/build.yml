name: Build Desktop App
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Install Electron dependencies
        run: npm install

      - name: Build frontend
        run: |
          cd web
          pnpm install --no-frozen-lockfile
          pnpm build

      - name: Free disk space
        run: |
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes || true
          df -h

      - name: Build macOS DMG
        run: |
          for i in 1 2 3; do
            echo "Build attempt $i..."
            npx electron-builder --mac && break
            echo "Attempt $i failed, waiting 15s before retry..."
            sleep 15
          done
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true

      - name: List release files
        run: find release -name "*.dmg" 2>/dev/null || echo "No dmg found"

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            release/*.dmg
            release/**/*.dmg
          if-no-files-found: error

      - name: Create GitHub Release and upload DMG
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Creating release for tag: $TAG"

          gh release create "$TAG" \
            --title "奇妙奇遇光影集 $TAG" \
            --notes "自动构建发布。macOS 安装包请下载 .dmg 文件。" \
            --repo "$GITHUB_REPOSITORY" \
            || echo "Release may already exist, continuing..."

          find release -name "*.dmg" | while read dmg; do
            echo "Uploading: $dmg"
            gh release upload "$TAG" "$dmg" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          done
